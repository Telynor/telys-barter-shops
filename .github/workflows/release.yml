name: Build Foundry Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read and validate manifest version
        id: version
        shell: bash
        run: |
          module_version="$(jq -r '.version' module.json)"
          manifest_version="$(jq -r '.version' manifest.json)"
          test "$module_version" = "$manifest_version"
          echo "version=$module_version" >> "$GITHUB_OUTPUT"

      - name: Build module archive
        shell: bash
        run: |
          mkdir -p build/telys-barter-shops
          cp -R module.json README.md lang scripts styles templates build/telys-barter-shops/
          cd build/telys-barter-shops
          zip -r ../telys-barter-shops.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            manifest.json
            module.json
            build/telys-barter-shops.zip
